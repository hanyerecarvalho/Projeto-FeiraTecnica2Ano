<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploração do Planeta Terra</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="">
    <div class="div-main">
        <div class="barra">
            <div class="Titulos">
                <span class="emoji">🌍</span>
                <span class="titulo">Planetary View 3D</span>
            </div>

          <div class="pesquisar">
                <span class="pesquisaIcone"></span>
                <input id="inputPesquisa" type="text" placeholder="Pesquisar cidade..." autocomplete="off">
                 <ul id="sugestoesPesquisa" class="sugestoes" role="listbox" hidden></ul>
            </div>

            <div class="grupo-horarios">
                <div class="horario-item">
                    <span class="horario-label">Local</span>
                    <span class="horario-valor" id="horario-local">--:--:--</span>
                </div>
                <div class="divisor-vertical"></div>
                <div class="horario-item">
                    <span class="horario-label">UTC</span>
                    <span class="horario-valor" id="horario-utc">--:--:--</span>
                </div>
                <div class="divisor-vertical"></div>
                <div class="botaoTema">
                    <button id="btn-tema" type="button" aria-label="Alternar tema">🌙</button>
                </div>
            </div>
        </div>

        <div id="cena3d-container"></div>

        <section id="informacoesCidade" class="informacoes-cidade" hidden aria-live="polite">
            <div class="informacoes-cidade-cabecalho">
                <div>
                    <span class="informacoes-cidade-pais" id="cidadePais"></span>
                    <h2 id="cidadeNome"></h2>
                </div>
                <button id="fecharInformacoes" type="button" aria-label="Fechar informações">×</button>
            </div>
            <div class="informacoes-cidade-dados">
                <p><strong>Localização:</strong> <span id="cidadeCoordenadas"></span></p>
                <p><strong>Clima:</strong> <span id="cidadeClima">Consultando...</span></p>
                <p><strong>Habitantes:</strong> <span id="cidadeHabitantes">Consultando...</span></p>
                <p><strong>Fuso Horário:</strong> <span id="cidadeHorario">Consultando...</span></p>
                <p><strong>Sensação Térmica:</strong> <span id="cidadeSensacao">Consultando...</span></p>
            </div>
            <p id="mensagemCidade" class="mensagem-cidade"></p>
        </section>

    </div>

    <script src="../js/tema.js"></script>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/horarios.js"></script>

</body>
</html>
