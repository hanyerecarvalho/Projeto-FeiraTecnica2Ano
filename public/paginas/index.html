<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploração do Planeta Terra</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="">
    <div class="div-main">

        <div class="barra">
            <div class="Titulos">
                <span class="emoji">🌍</span>
                <span class="titulo">Planetário 3D</span>
            </div>

            <div class="pesquisar">
                <span class="pesquisaIcone">🔍</span>
                <input id="inputPesquisa" type="text" placeholder="Pesquisar cidade...">
            </div>

            <div class="grupo-horarios">
                <div class="horario-item">
                    <span class="horario-label">Local</span>
                    <span class="horario-valor" id="horario-local">--:--:--</span>
                </div>
                <div class="divisor-vertical"></div>
                <div class="horario-item">
                    <span class="horario-label">UTC</span>
                    <span class="horario-valor" id="horario-utc">--:--:--</span>
                </div>
                <div class="divisor-vertical"></div>
                <div class="botaoTema">
                    <button id="btn-tema" type="button" aria-label="Alternar tema">🌙</button>
                </div>
            </div>
        </div>

        <div id="cena3d-container"></div>

    </div>

    <script src="../js/tema.js"></script>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/horarios.js"></script>

</body>
</html>
